name: serguicv CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.1"

# ─────────────────────────────────────────────────────────
# JOB 1 — Audit de dependencias (sin DB necesaria)
# ─────────────────────────────────────────────────────────
jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # Laravel 9 es EOL: sus advisories (p.ej. GHSA-5vg9-5847-vvmq, CRLF en la
      # regla email) no tendrán fix en 9.x, así que este paso es informativo y
      # no bloquea. Mitigaciones en la app: email:filter en Contact/Lead, sin
      # signed URLs ni uploads. Fix real: migrar a Laravel 12+ (pendiente).
      - name: Composer audit (informativo — Laravel 9 EOL)
        run: composer audit
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high

# ─────────────────────────────────────────────────────────
# JOB 2 — Tests PHP (sin DB — portfolio)
# ─────────────────────────────────────────────────────────
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      # Con dev-deps: php artisan test necesita phpunit/collision (son require-dev)
      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test --stop-on-failure

# ─────────────────────────────────────────────────────────
# JOB 3 — Deploy (solo en push a main/master)
# ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [audit, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}/serguicv"

            echo "🔄 Pulling latest code..."
            git pull origin ${{ github.ref_name }}

            # Build nueva imagen Docker
            echo "🏗️ Building Docker image..."
            docker compose build app

            # Guardar imagen actual para rollback
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' serguicv_app 2>/dev/null || true)

            # Zero-downtime: el compose up reemplaza el contenedor
            docker compose up -d --no-deps app

            # Health check post-deploy
            echo "🔍 Verificando health check..."
            SUCCESS=false
            for i in $(seq 1 20); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost/en 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "✅ Servicio OK (intento $i)"
                SUCCESS=true
                break
              fi
              echo "  [$i/20] HTTP $HTTP — esperando 5s..."
              sleep 5
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "❌ Health check falló — iniciando rollback..."
              if [ -n "$PREV_IMAGE" ]; then
                docker tag "$PREV_IMAGE" serguicv_app:rollback 2>/dev/null || true
                docker compose up -d --no-deps app
              fi
              exit 1
            fi

            echo "✅ Deploy de serguicv completado — $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `🚨 Deploy serguicv falló — ${context.sha.substring(0, 7)}`,
              body: `**Branch:** ${context.ref}\n**Actor:** ${context.actor}\n**Commit:** ${context.sha}`,
              labels: ['deploy-failure']
            })
