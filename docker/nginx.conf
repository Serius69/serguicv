user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP lo emite el middleware App\Http\Middleware\SecurityHeaders (es
        # AdSense/GA-aware). No duplicarlo aquí: dos headers CSP se intersecan y
        # el más estricto ganaba, bloqueando fuentes/iconos/scripts legítimos.

        # Static assets — 1 year cache
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|mp4|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Favicon / robots — short cache
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Block access to hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Block access to sensitive directories
        location ~* ^/(vendor|storage|bootstrap/cache) {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 60;
            # The portfolio is one large page (~700KB). Keep the whole FastCGI
            # response in memory so nginx never spills to /var/lib/nginx/tmp
            # (which the unprivileged worker can't write → truncated 200s).
            fastcgi_buffer_size 128k;
            fastcgi_buffers 64 32k;
            fastcgi_busy_buffers_size 256k;
        }
    }
}
